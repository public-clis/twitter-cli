name: CI

# Pull requests from first-time contributors need a maintainer to approve the
# workflow run ("action_required"), otherwise no checks are reported and the PR
# looks untested. Repository admins can switch this off under
# Settings -> Actions -> General -> "Fork pull request workflows from outside
# collaborators" (require approval for first-time contributors).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Pin the runner image: "ubuntu-latest" is a moving target (it migrates to
    # Ubuntu 26 in Oct 2026), which makes a failure hard to attribute.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    # A job with no timeout inherits GitHub's 30-day ceiling: a hung dependency
    # install or a stalled test keeps the whole PR in "expected" state until
    # then. Bound it so a stall fails fast and visibly instead.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        # setup-uv publishes no floating v10 major tag, so pin the release.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev
        timeout-minutes: 10

      # Fail fast on the cheap static checks, then run the suite.
      - name: Lint
        run: uv run ruff check .
        timeout-minutes: 5

      - name: Type check
        run: uv run mypy twitter_cli
        timeout-minutes: 5

      - name: Test
        run: uv run pytest -q
        timeout-minutes: 10
